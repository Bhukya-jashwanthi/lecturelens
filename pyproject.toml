[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lecturelens"
version = "0.1.0"
description = "Ask questions across YouTube lectures and get answers with clickable timestamp citations."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Deprecations inside third-party libraries (not our code); they do not affect us.
    "ignore::DeprecationWarning:google.genai.*",
    "ignore::DeprecationWarning:chromadb.*",
]
