name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -e .

      # Tests use fake embeddings and a fake LLM, so no real API key is needed.
      - name: Run tests
        run: pytest -q
        env:
          GOOGLE_API_KEY: dummy-key-for-tests
